# ==============================================================================
# The Golden Circle - Production Nginx Configuration
# Reverse Proxy, SSL/TLS Termination, WebSocket (Socket.IO), and Security Headers
# ==============================================================================

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Upstream Backend Server Cluster
upstream backend_cluster {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# HTTP to HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name thegoldencircle.io www.thegoldencircle.io api.thegoldencircle.io;

    # ACME Challenge for Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Primary Virtual Host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thegoldencircle.io www.thegoldencircle.io;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/thegoldencircle.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thegoldencircle.io/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/thegoldencircle.io/chain.pem;

    # SSL Protocols & Ciphers (Mozilla Modern Standard)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Caching
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' wss: https:;" always;

    # Maximum Request Payload Size (10MB for avatars/covers)
    client_max_body_size 10M;

    # 1. API Endpoints Proxy
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. Strict Rate Limiting for Auth
    location /api/auth/login {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Socket.IO Real-Time WebSocket Proxy
    location /socket.io/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Uploaded Assets (Static file serving with aggressive caching)
    location /uploads/ {
        alias /var/www/golden-circle/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 5. Frontend Single Page Application (SPA Fallback)
    root /var/www/golden-circle/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
